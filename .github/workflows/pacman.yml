name: Generate Pac-Man Graph

on:
  # Runs automatically every 24 hours
  schedule:
    - cron: "0 0 * * *" 
  
  # Allows you to run it manually whenever you want
  workflow_dispatch:
  
  # Runs whenever you push code to the master branch
  push:
    branches:
    - master
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate-pacman-game-from-github-contribution-grid
        uses: Platane/snk@v3
        with:
          # Your GitHub username
          github_user_name: Abhishek20044
          
          # PAC-MAN COLORS
          # Background: Dark Grey
          # Snake: Yellow (Pac-Man)
          # Dots: Ghost Colors (Pink, Blue, Orange, Red)
          outputs: |
            dist/pacman.svg?color_snake=#ffff00&color_dots=#0d1117,#ffb8ff,#00ffff,#ffb852,#ff0000
            
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: push-pacman-to-output-branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
