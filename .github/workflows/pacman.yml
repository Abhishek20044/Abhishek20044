name: Generate Pac-Man Game

on:
  # Run automatically every 24 hours
  schedule:
    - cron: "0 0 * * *"
  
  # Allows manual triggering
  workflow_dispatch:
  
  # Runs on every push to the main branch
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Step 1: Generate the animation
      - name: generate-pacman-game-from-github-contribution-grid
        uses: Platane/snk@v3
        with:
          # Your GitHub username
          github_user_name: Abhishek20044
          
          # PAC-MAN THEME SETTINGS
          # We define the color palette here to look like the game
          outputs: |
            dist/pacman.svg?color_snake=#ffff00&color_dots=#0d1117,#ffb8ff,#00ffff,#ffb852,#ff0000
            
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Push the image to the 'output' branch
      - name: push-pacman-to-output-branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
